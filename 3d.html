    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #060911;
      font-family: 'Kanit', 'Noto Sans JP', sans-serif;
      touch-action: manipulation;
      overflow-x: hidden;
    }
    canvas#webgl {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      pointer-events: none;
    }
    .hud-layer {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }
    .hud-interactive {
      pointer-events: auto;
    }
    .touch-target {
      min-height: 48px;
    }
    /* Mobile-first clean frosted glass */
    .glass-panel {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px -4px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .scanner-glow {
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
    }
    .kanji-hero {
      text-shadow: 0 0 16px rgba(16, 185, 129, 0.35);
    }
    .ruby-text {
      ruby-align: center;
      ruby-position: over;
    }
    rt {
      font-size: 0.55em;
      color: #38bdf8;
      font-weight: 500;
      letter-spacing: normal;
    }
    @media (max-height: 720px) {
      .compact-hide {
        display: none !important;
      }
      .compact-p {
        padding: 0.5rem !important;
      }
    }

</head>

    // Speech API Japanese Male Voice
    function initSpeech() {
      if (!('speechSynthesis' in window)) return;
      const selectVoice = () => {
        const voices = window.speechSynthesis.getVoices();
        const jpVoices = voices.filter(v => v.lang.startsWith('ja') || v.lang === 'ja_JP');
        const maleKeywords = ['male', 'ichiro', 'keita', 'takumi', 'naoki', 'daichi', 'kenji', 'otoko'];
        maleVoice = jpVoices.find(v => maleKeywords.some(kw => v.name.toLowerCase().includes(kw))) || jpVoices[0] || null;
      };
      window.speechSynthesis.onvoiceschanged = selectVoice;
      selectVoice();
    }

    function speakJapanese(text) {
      if (!soundEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/<[^>]*>/g, '').replace(/[「」]/g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'ja-JP';
      if (maleVoice) utterance.voice = maleVoice;
      utterance.pitch = 0.78;
      utterance.rate = 0.90;
      window.speechSynthesis.speak(utterance);
    }

    function initThree() {
      const container = document.getElementById('webgl');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060911);
      scene.fog = new THREE.FogExp2(0x060911, 0.035);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      updateCameraForViewport();

      renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);

      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      // Lighting: Japanese Convenience Store Glow + Cool Shelf Accents
      const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.85);

    function buildStoreEnvironment() {

      floor.receiveShadow = true;
      scene.add(floor);

      // Back Wall & Large Glass Storefront Windows
      const wallGeo = new THREE.PlaneGeometry(24, 10);
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.8 });
      const backWall = new THREE.Mesh(wallGeo, wallMat);
      backWall.position.set(0, 4, -4.5);
      backWall.receiveShadow = true;
      scene.add(backWall);

      // Convenience Store Shelves (Rows of Japanese Goods)
      storeShelvesGroup = new THREE.Group();
      scene.add(storeShelvesGroup);

      const shelfMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4, metalness: 0.2 });
      const canColors = [0xef4444, 0x0284c7, 0x10b981, 0xf59e0b, 0x8b5cf6, 0xffffff];

      for (let s = -2; s <= 2; s += 2) {
        const shelf = new THREE.Mesh(new THREE.BoxGeometry(1.7, 2.4, 0.45), shelfMat);
        shelf.position.set(s * 1.55, 1.2, -2.8);
        shelf.castShadow = true;
        shelf.receiveShadow = true;
        storeShelvesGroup.add(shelf);

        // Neat 3-tier Rows of Japanese Drinks and Bento boxes
        for (let row = 0; row < 3; row++) {
          for (let col = -3; col <= 3; col++) {
            const matIdx = (Math.abs(s) + row + Math.abs(col)) % canColors.length;
            const canMat = new THREE.MeshStandardMaterial({ color: canColors[matIdx], roughness: 0.3, metalness: 0.4 });

      counterGroup.add(counterBase);

        new THREE.BoxGeometry(2.6, 0.05, 1.02),
        new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.2, metalness: 0.1 })
      );
      counterTop.position.set(0, 0.885, 0.2);
      counterGroup.add(counterTop);
      scene.add(counterGroup);

      // Detailed POS Cash Register with Screen & Barcode Laser Scanner

        new THREE.BoxGeometry(0.38, 0.12, 0.38),

      posGroup.add(posBase);

      const posScreen = new THREE.Mesh(

    function updateCameraForViewport() {
      if (!camera) return;
      const isMobile = window.innerWidth < 640;
      const isShort = window.innerHeight < 700;
      if (isMobile) {
        camera.fov = isShort ? 55 : 52;
        camera.position.set(0, 1.35, 4.3);
        camera.lookAt(0, 0.95, 0);
      } else {
        camera.fov = 45;
        camera.position.set(0, 1.45, 3.8);
        camera.lookAt(0, 1.1, 0);
      }
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }

    function onWindowResize() {
      updateCameraForViewport();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      // Subtle breathing motion for 3D Customer
      if (customerMeshGroup) {
        customerMeshGroup.position.y = Math.sin(elapsed * 2.4) * 0.022;
      }
      // Floating inspection rotation for 3D Item
      if (item3DMesh) {
        item3DMesh.rotation.y += delta * 0.75;
      }

      renderer.render(scene, camera);
    }

            kanjiTag: `คำช่วย は`,
            isCorrect: false,
            reason: `ข้อนี้ขาดความหมาย "ก็...เหมือนกัน" ต้องใช้คำช่วย も`
          },
          {
            jpRead: `あなたは タイ人ですか。`,
            jpRaw: `あなたは タイ人ですか。`,
            th: `คุณเป็นคนไทยใช่ไหมครับ?`,
            kanjiTag: `ประโยคคำถาม`,
            isCorrect: false,
            reason: `นี่เป็นประโยคคำถามถามคู่สนทนา`
          },
          {
            jpRead: `わたしは タイ人じゃありません。`,
            jpRaw: `わたしは タイ人じゃありません。`,
            th: `ฉันไม่ได้เป็นคนไทย`,
            kanjiTag: `ปฏิเสธ`,
            isCorrect: false,
            reason: `นี่เป็นรูปปฏิเสธ`
          }
        ].sort(() => 0.5 - Math.random());

        currentQuestion = { choices };
        renderChoices(choices);
      }
    }

    function updateNpcHUD(customer, jpPromptHtml, thaiSub) {
      document.getElementById('npc-avatar-badge').textContent = customer.avatar;
      document.getElementById('npc-name-badge').textContent = customer.name;
      document.getElementById('npc-org-badge').textContent = customer.org;
      document.getElementById('npc-japanese-text').innerHTML = jpPromptHtml;
      document.getElementById('npc-thai-sub').textContent = thaiSub;
      speakJapanese(jpPromptHtml);
    }

    function updateScannerHUD(item) {
      document.getElementById('item-inspect-card').classList.remove('hidden');
      document.getElementById('scanner-kanji').textContent = item.kanji;
      document.getElementById('scanner-kana').textContent = item.name;
      document.getElementById('scanner-romaji').textContent = item.romaji;
      document.getElementById('scanner-meaning').textContent = item.meaning;
      document.getElementById('scanner-cat').textContent = item.cat;
      document.getElementById('scanner-price-kanji').textContent = item.price_kanji;
      document.getElementById('scanner-price').textContent = `¥${item.price.toLocaleString()}`;
    }

    function renderChoices(choices) {
      const container = document.getElementById('choice-grid');
      container.innerHTML = '';

      choices.forEach((choice, idx) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn glass-panel touch-target p-2.5 sm:p-3 rounded-2xl text-left border border-slate-700/80 hover:border-emerald-400/80 active:scale-[0.98] transition-all flex flex-col justify-center relative overflow-hidden';
        btn.innerHTML = `
          <div class="flex items-center justify-between w-full mb-1">
            <span class="text-[10px] font-mono text-slate-400 font-bold bg-slate-800/90 px-1.5 py-0.5 rounded border border-slate-700">${choice.kanjiTag || 'CHOICE'}</span>
            <span class="text-[10px] font-mono text-slate-500">0${idx+1}</span>
          </div>
          <div class="text-xs sm:text-sm font-bold text-white font-jp leading-snug break-words">${choice.jpRead}</div>
          <span class="text-[11px] text-slate-400 mt-1 leading-tight line-clamp-1">${choice.th}</span>
        `;
        btn.onclick = () => handleAnswer(choice, btn);
        container.appendChild(btn);
      });
    }

    function handleAnswer(choice, btnElement) {
      if (isProcessing) return;
      isProcessing = true;

      const expBox = document.getElementById('explanation-box');
      const expIcon = document.getElementById('explanation-icon');
      const expText = document.getElementById('explanation-text');

      if (choice.isCorrect) {
        currentScore += 10;
        streakCount += 1;
        btnElement.classList.add('bg-emerald-950/90', 'border-emerald-400', 'text-emerald-100');
        expIcon.textContent = '✓ ถูกต้อง';
        expIcon.className = 'text-emerald-400 font-bold shrink-0';
        speakJapanese('せいかいです！ よくできました。');
      } else {
        streakCount = 0;
        btnElement.classList.add('bg-rose-950/90', 'border-rose-500', 'text-rose-100');
        expIcon.textContent = '✗ ไม่ถูกต้อง';
        expIcon.className = 'text-rose-400 font-bold shrink-0';
        speakJapanese('ちがいます。もういちど。');
      }

      document.getElementById('score-val').textContent = currentScore;
      document.getElementById('streak-counter').textContent = `คอมโบ: ${streakCount}`;
      expText.textContent = choice.reason;
      expBox.classList.remove('hidden');

      setTimeout(() => {
        nextQuestion();
      }, choice.isCorrect ? 1500 : 2500);
    }

    // Audio prompt button
    document.getElementById('btn-speak-prompt').onclick = () => {
      const promptEl = document.getElementById('npc-japanese-text');
      speakJapanese(promptEl.textContent);
    };

    // Toggle audio
    document.getElementById('btn-audio-toggle').onclick = () => {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('icon-sound-on');
      icon.classList.toggle('text-emerald-400', soundEnabled);
      icon.classList.toggle('text-slate-600', !soundEnabled);
    };

    // Initialize App
    window.addEventListener('DOMContentLoaded', () => {
      initSpeech();
      initThree();
      nextQuestion();
    });
  </script>
</body>
</html>
